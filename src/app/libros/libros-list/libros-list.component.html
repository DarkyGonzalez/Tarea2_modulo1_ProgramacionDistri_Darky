<mat-card class="libros-card">
  <mat-card-header>
    <mat-card-title>
      <mat-icon>menu_book</mat-icon> Catálogo de Libros
    </mat-card-title>
    <mat-card-subtitle>Selecciona un libro para agregarlo al carrito</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <table mat-table [dataSource]="dataSource" class="libros-table">

      <!-- Columna ID -->
      <ng-container matColumnDef="idLibro">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let libro">{{ libro.idLibro }}</td>
      </ng-container>

      <!-- Columna Título -->
      <ng-container matColumnDef="titulo">
        <th mat-header-cell *matHeaderCellDef>Título</th>
        <td mat-cell *matCellDef="let libro">{{ libro.titulo }}</td>
      </ng-container>

      <!-- Columna Descripción -->
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let libro">{{ libro.descripcion }}</td>
      </ng-container>

      <!-- Columna Precio -->
      <ng-container matColumnDef="precio">
        <th mat-header-cell *matHeaderCellDef>Precio</th>
        <td mat-cell *matCellDef="let libro">$ {{ libro.precio | number:'1.2-2' }}</td>
      </ng-container>

      <!-- Columna Stock -->
      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef>Stock</th>
        <td mat-cell *matCellDef="let libro">{{ libro.stock }}</td>
      </ng-container>

      <!-- Columna Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let libro">
          <button mat-raised-button color="primary" (click)="agregarAlCarrito(libro)">
            <mat-icon>add_shopping_cart</mat-icon> Agregar
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </mat-card-content>
</mat-card>
